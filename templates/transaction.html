<a class="transaction" href="/sessions/{{paymentID}}">
  <span class="tx-icon">{{icon}}</span>
  <span class="tx-main">
    <strong>{{kindLabel}}</strong>
    <small>{{createdAt}} · {{paymentID}}</small>
  </span>
  <strong class="tx-amount">€ {{amount}}</strong>
  <span class="badge {{statusClass}}">{{statusLabel}}</span>
  <span class="chevron">›</span>
</a>
