<div class="checkout-card">
  <div class="checkout-icon">↗</div>
  <h3>Lightbox</h3>
  <p>Il pagamento si apre sopra questa pagina. Al termine, la callback torna qui
     e l’app verifica l’esito sul server.</p>
  <button class="button primary" id="open-lightbox"
          data-shop="{{shopLogin}}"
          data-payment-id="{{paymentID}}"
          data-payment-token="{{paymentToken}}">
    Apri il checkout Fabrick <span>↗</span>
  </button>
  <p id="sdk-status" class="form-hint">Caricamento del checkout Fabrick…</p>
</div>
