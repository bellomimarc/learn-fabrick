<div class="checkout-card embedded">
  <div class="checkout-icon">▣</div>
  <h3>Web Component</h3>
  <p>Il checkout Fabrick viene montato qui sotto. Dopo il pagamento tornerai
     alla pagina di esito.</p>
  <div class="component-frame">
    <fbk-checkout shop-login="{{shopLogin}}"
                  payment-id="{{paymentID}}"
                  payment-token="{{paymentToken}}"></fbk-checkout>
  </div>
  <p id="sdk-status" class="form-hint">Caricamento del componente Fabrick…</p>
</div>
